<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>询盘管理 · HuiBu Hotel IPTV</title>
<style>
  :root { --blue:#0B6FD6; --teal:#00BFA5; --ink:#0F172A; --muted:#64748B; --line:#E2E8F0; --bg:#F4F8FD; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
  header { background:linear-gradient(110deg,#071426,#0B6FD6); color:#fff; padding:22px 28px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  header .logo { width:34px; height:34px; border-radius:10px; background:#fff; color:var(--blue); display:grid; place-items:center; font-weight:800; font-size:18px; }
  header h1 { margin:0; font-size:18px; font-weight:800; letter-spacing:-.02em; }
  header .sub { font-size:12px; opacity:.75; margin-left:auto; }
  main { max-width:1240px; margin:0 auto; padding:26px 20px 60px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 8px 30px rgba(15,23,42,.05); padding:22px; }
  .login { max-width:460px; }
  label { display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:6px; }
  input[type=password] { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font-size:14px; outline:0; }
  input[type=password]:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(11,111,214,.13); }
  button { font:inherit; font-weight:700; cursor:pointer; border:0; border-radius:10px; padding:9px 16px; background:var(--blue); color:#fff; }
  button:hover { filter:brightness(1.07); }
  button.ghost { background:#EEF4FB; color:var(--blue); }
  button:disabled { opacity:.55; cursor:default; }
  .login .row { display:flex; gap:10px; align-items:center; margin-top:14px; }
  .hint { font-size:12px; color:var(--muted); margin:12px 0 0; }
  .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
  .bar .count { font-weight:700; margin-right:auto; }
  .msg { padding:12px 14px; border-radius:10px; margin-bottom:16px; font-size:13px; display:none; }
  .msg.show { display:block; }
  .msg.err { background:#FFF1F2; color:#BE123C; border:1px solid #FECDD3; }
  .msg.ok { background:#ECFDF5; color:#047857; border:1px solid #A7F3D0; }
  .table-wrap { background:#fff; border:1px solid var(--line); border-radius:16px; overflow:auto; box-shadow:0 8px 30px rgba(15,23,42,.05); }
  table { border-collapse:collapse; width:100%; min-width:1000px; font-size:12.5px; }
  th, td { padding:11px 13px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top; }
  th { background:#F8FAFC; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; white-space:nowrap; position:sticky; top:0; }
  tbody tr:hover { background:#F8FBFF; }
  td.msg-cell { max-width:320px; white-space:pre-wrap; word-break:break-word; }
  td a { color:var(--blue); }
  .tag { display:inline-block; padding:2px 8px; border-radius:999px; background:#E8F3FF; color:var(--blue); font-size:11px; font-weight:700; }
  .tag.cb { background:#ECFDF5; color:#047857; }
  .empty { padding:40px; text-align:center; color:var(--muted); }
  @media (max-width:640px) { header .sub { display:none; } main { padding:18px 12px; } }
</style>
</head>
<body>
<header>
  <div class="logo">H</div>
  <h1>询盘管理</h1>
  <span class="sub">hotel.hoteliptv.cc · Cloudflare Pages</span>
</header>
<main>
  <div class="card login" id="login">
    <label for="token">管理令牌（ADMIN_TOKEN）</label>
    <input type="password" id="token" placeholder="请输入 Cloudflare 中设置的管理令牌" autocomplete="off">
    <div class="row">
      <button id="btnLoad">加载询盘</button>
      <span id="loginHint" class="hint" style="margin:0"></span>
    </div>
    <p class="hint">令牌仅保存在当前标签页的会话中，关闭页面即失效。请勿分享此页面链接与令牌。</p>
  </div>

  <div id="panel" hidden>
    <div class="bar">
      <span class="count" id="count">—</span>
      <button class="ghost" id="btnRefresh">刷新</button>
      <button class="ghost" id="btnCsv">导出 CSV</button>
      <button class="ghost" id="btnLogout">退出</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>时间</th><th>来源</th><th>姓名</th><th>酒店 / 物业</th><th>邮箱</th><th>电话</th>
          <th>物业类型</th><th>房间数</th><th>留言</th><th>语言</th><th>IP</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="empty" hidden>暂无询盘记录</div>
    </div>
  </div>
</main>

<script>
(function () {
  'use strict';
  var KEY = 'hoteliptv_admin_token';
  var items = [];
  var $ = function (id) { return document.getElementById(id); };

  function showMsg(text, kind) {
    var el = $('msg');
    el.textContent = text;
    el.className = 'msg show ' + (kind || 'ok');
  }
  function hideMsg() { $('msg').className = 'msg'; }

  function esc(v) { return String(v == null ? '' : v); }

  function fmtTime(s) {
    var d = new Date(s);
    if (isNaN(d.getTime())) return esc(s);
    return d.toLocaleString('zh-CN', { hour12: false });
  }

  function render() {
    var tbody = $('tbody');
    tbody.innerHTML = '';
    items.forEach(function (it) {
      var tr = document.createElement('tr');
      var cells = [
        fmtTime(it.createdAt),
        it.source || 'demo',
        it.name, it.hotel, it.email, it.phone,
        it.type || '-', it.rooms || '-',
        it.message || '-', it.lang || '-', it.ip || '-'
      ];
      cells.forEach(function (v, idx) {
        var td = document.createElement('td');
        if (idx === 1) {
          var tag = document.createElement('span');
          tag.className = 'tag' + (v === 'callback' ? ' cb' : '');
          tag.textContent = v === 'callback' ? '回电' : 'Demo';
          td.appendChild(tag);
        } else if (idx === 4 && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) {
          var a = document.createElement('a');
          a.href = 'mailto:' + v;
          a.textContent = v;
          td.appendChild(a);
        } else {
          td.textContent = esc(v);
          if (idx === 8) td.className = 'msg-cell';
        }
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    $('empty').hidden = items.length > 0;
    $('count').textContent = '共 ' + items.length + ' 条询盘（最近 200 条）';
  }

  function load() {
    var t = sessionStorage.getItem(KEY) || $('token').value.trim();
    if (!t) { $('loginHint').textContent = '请先输入令牌'; return; }
    sessionStorage.setItem(KEY, t);
    $('btnLoad').disabled = true;
    $('loginHint').textContent = '正在加载…';
    hideMsg();

    fetch('/api/leads', { headers: { 'Authorization': 'Bearer ' + t } })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (j) {
          return { status: r.status, data: j };
        });
      })
      .then(function (res) {
        $('btnLoad').disabled = false;
        $('loginHint').textContent = '';
        if (res.status === 401) {
          sessionStorage.removeItem(KEY);
          $('loginHint').textContent = '令牌无效';
          return;
        }
        if (res.status !== 200 || !res.data.ok) {
          showMsg('加载失败：' + (res.data.error || ('HTTP ' + res.status)), 'err');
          return;
        }
        items = res.data.items || [];
        $('login').hidden = true;
        $('panel').hidden = false;
        render();
      })
      .catch(function (e) {
        $('btnLoad').disabled = false;
        $('loginHint').textContent = '';
        showMsg('网络错误：' + esc(e && e.message), 'err');
      });
  }

  function toCsv() {
    if (!items.length) { showMsg('没有可导出的数据', 'err'); return; }
    var head = ['时间', '来源', '姓名', '酒店', '邮箱', '电话', '物业类型', '房间数', '留言', '语言', 'IP'];
    var keys = ['createdAt', 'source', 'name', 'hotel', 'email', 'phone', 'type', 'rooms', 'message', 'lang', 'ip'];
    function cell(v) {
      var s = String(v == null ? '' : v).replace(/"/g, '""');
      return '"' + s + '"';
    }
    var lines = [head.map(cell).join(',')];
    items.forEach(function (it) {
      lines.push(keys.map(function (k) { return cell(it[k]); }).join(','));
    });
    var blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'leads-' + new Date().toISOString().slice(0, 10) + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  $('btnLoad').addEventListener('click', load);
  $('token').addEventListener('keydown', function (e) { if (e.key === 'Enter') load(); });
  $('btnRefresh').addEventListener('click', load);
  $('btnCsv').addEventListener('click', toCsv);
  $('btnLogout').addEventListener('click', function () {
    sessionStorage.removeItem(KEY);
    items = [];
    $('token').value = '';
    $('panel').hidden = true;
    $('login').hidden = false;
    hideMsg();
  });
  if (sessionStorage.getItem(KEY)) load();
})();
</script>
</body>
</html>
